# 主题配置文件示例
# 路径：/Volumes/Storage/_meta/events.yaml
# 用 ./scripts/add_theme.py --interactive 追加，或手动编辑

# ============================================================
# 主题列表
# ============================================================
themes:
  # ----- 示例 1：日期范围 + 来源（最常用）-----
  - name: 海南
    month: 2026-07
    # 主题文件夹命名：<year>-<month>_<theme>
    # → by-date/2026/2026-07_海南/
    date_range:
      start: 2026-07-10
      end: 2026-07-18
    sources:
      - iphone
      - canon
      - dji-nano
    # 可选：显式文件列表（优先级最高）
    # files:
    #   - 20260715_183022_iphone_a3f2.heic
    #   - 20260716_xxx_canon-a_b4e1.cr2

  # ----- 示例 2：单来源 + 月份（适用于"这个月只这一个主题"）-----
  - name: 夏令营
    month: 2026-08
    sources:
      - iphone
    # 注意：当月只有一个主题时，sources 命中的文件全部进 _夏令营/，不进默认 2026-08/

  # ----- 示例 3：纯文件列表（不依赖日期推断）-----
  - name: 重要证件照
    month: 2026-06
    files:
      - 20260601_100000_iphone_a3f2.heic
      - 20260615_140000_iphone_b4e1.heic

  # ----- 示例 4：同月多主题-----
  # 海南 和 夏令营 都是 2026-07，文件分别进对应主题桶
  # by-date/2026/
  #   ├── 2026-07/                 ← 默认桶（没匹配任何主题的）
  #   ├── 2026-07_海南/             ← 旁挂桶 1
  #   └── 2026-07_夏令营/          ← 旁挂桶 2

# ============================================================
# 字段说明
# ============================================================
# name        必填  主题名（中文/英文均可）会出现在文件夹和相册名中
# month       必填  YYYY-MM 格式；主题限定在一个月内
# date_range  可选  {start, end} 拍摄日期落在这个区间才匹配
# sources     可选  [list] 文件名里 source 段必须在这个列表里
# files       可选  [list] 显式列出文件路径，优先级最高

# ============================================================
# 匹配顺序（先满足先命中）
# ============================================================
# 1. files 显式列表命中
# 2. date_range + sources 同时匹配
# 3. 仅 sources 匹配且该月份只有一个主题
# 4. 都不命中 → 进默认桶 by-date/<year>/<month>/

# ============================================================
# 修改后的操作
# ============================================================
# 1. 编辑本文件
# 2. 跑 rename_organize.py 让新配置生效（幂等）
#    ./scripts/rename_organize.py
# 3. 已分桶的文件会自动从默认桶搬到主题桶
#    （同名时追加 _1 _2 避免覆盖）
# 4. 同步到备份盘
#    ./scripts/sync_to_backup.sh

# ============================================================
# 截图 / 录屏不进主题桶（v7）
# ============================================================
# 截图 → screenshots/（screenshot_ 前缀）；录屏 → screenrecords/（screenrecorder_）
# 文档 → docs/（doc_ 前缀，仅 Web 手动「移至文档」）
# **不按月份/主题分类**。events.yaml 的主题配置只对 by-date 下的
# 照片/视频生效，不影响截图/录屏/文档。