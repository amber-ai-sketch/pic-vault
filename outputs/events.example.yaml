# 主题配置文件示例
# 路径：/Volumes/Storage/_meta/events.yaml
# 用 ./scripts/add_theme.py --interactive 追加，或手动编辑

# ============================================================
# 主题列表
# ============================================================
themes:
  # ----- 示例 1：日期范围 + 来源（最常用）-----
  - name: 海南
    # month 可省略：有 date_range.start 时自动写成开始月
    date_range:
      start: 2026-07-10
      end: 2026-07-18
    sources:
      - iphone
      - canon
      - dji-nano
    # 主题桶：by-date/2026/2026-07_海南/（按开始月命名）

  # ----- 示例 1b：跨月区间（桶名仍用开始月）-----
  - name: 香港-深圳
    date_range:
      start: 2025-12-28
      end: 2026-01-05
    # → by-date/2025/2025-12_香港-深圳/
    # 2026-01-02 拍的文件也进这个桶；放回默认月桶则按拍摄月 → 2026-01/

  # ----- 示例 2：单来源 + 月份（适用于"这个月只这一个主题"）-----
  - name: 夏令营
    month: 2026-08
    sources:
      - iphone
    # 注意：当月只有一个主题时，sources 命中的文件全部进 _夏令营/，不进默认 2026-08/

  # ----- 示例 3：纯文件列表（不依赖日期推断）-----
  - name: 重要证件照
    month: 2026-06
    files:
      - 20260601_100000_iphone_a3f2.heic
      - 20260615_140000_iphone_b4e1.heic

  # ----- 示例 4：同开始月多主题-----
  # by-date/2026/
  #   ├── 2026-07/                 ← 默认桶（没匹配任何主题的）
  #   ├── 2026-07_海南/             ← 旁挂桶（开始月）
  #   └── …

# ============================================================
# 字段说明
# ============================================================
# name        必填  主题名（中文/英文均可）会出现在文件夹和相册名中
# month       可选* YYYY-MM；有 date_range.start 时可省略（= 开始月）；
#             若手写则必须与 start 同月。仅 sources/files 时仍需写 month。
# date_range  可选  {start, end}；可跨月；命中后进「开始月」主题桶
# sources     可选  [list] 文件名里 source 段必须在这个列表里
# files       可选  [list] 显式列出文件路径，优先级最高

# ============================================================
# 匹配顺序（先满足先命中）
# ============================================================
# 1. files 显式列表命中（不限月）
# 2. date_range（可跨月）+ 可选 sources
# 3. 仅 sources 且该 month 只有一个主题
# 4. 都不命中 → 进默认桶 by-date/<拍摄年>/<拍摄月>/

# ============================================================
# 修改后的操作
# ============================================================
# 1. 编辑本文件（或 Web /themes 保存）— 只改配置，不搬文件
# 2. 按主题同步（推荐，不冲掉其它主题桶的手工调整）
#    picvault theme rebucket --theme 海南 --yes
#    ./scripts/rename_organize.py --rebucket-themes --theme 海南
#    全量（慎用）：picvault theme rebucket --all --yes
# 3. 同步行为（仅对点名的主题）：
#    · 扩大区间：默认月桶 → 主题桶
#    · 缩小/改名：主题桶 → 默认月桶或改派
#    （同名时追加 _1 _2 避免覆盖）
# 4. 同步到备份盘
#    ./scripts/sync_to_backup.sh

# ============================================================
# 截图 / 录屏不进主题桶（v7）
# ============================================================
# 截图 → screenshots/（screenshot_ 前缀）；录屏 → screenrecords/（screenrecorder_）
# 文档 → docs/（doc_ 前缀，仅 Web 手动「移至文档」）
# 物品 → things/（things_ 前缀，仅 Web 手动「移至物品」）
# **不按月份/主题分类**。events.yaml 的主题配置只对 by-date 下的
# 照片/视频生效，不影响截图/录屏/文档/物品。